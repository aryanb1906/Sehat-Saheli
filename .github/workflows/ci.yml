name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # Dummy/placeholder values — sufficient to satisfy lib/env.ts's
  # assertCriticalEnv() and scripts/check-env.mjs during build/test.
  # No real secrets are used or required for CI.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sehat_saheli_test
  AUTH_SECRET: ci-placeholder-auth-secret-please-change
  NEXTAUTH_SECRET: ci-placeholder-nextauth-secret-please-change
  AUTH_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  GEMINI_API_KEY: ci-placeholder-gemini-api-key
  GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
  GOOGLE_CLIENT_SECRET: ci-placeholder-google-client-secret
  TWILIO_ACCOUNT_SID: ci-placeholder-twilio-account-sid
  TWILIO_AUTH_TOKEN: ci-placeholder-twilio-auth-token
  TWILIO_PHONE_NUMBER: "+10000000000"
  UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
  UPSTASH_REDIS_REST_TOKEN: ci-placeholder-upstash-token
  LOG_SINK_URL: ""
  ALERT_WEBHOOK_URL: ""

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sehat_saheli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node version from package.json
        id: node-version
        shell: bash
        run: |
          VERSION=$(node -e "const pkg = require('./package.json'); console.log((pkg.engines && pkg.engines.node) || '20')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
